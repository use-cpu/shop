# ====================================================================
# Nginx 配置: 托管前端静态资源 + 反向代理 /api 到后端服务
# 部署时通过环境变量 BACKEND_HOST 注入后端服务名:端口(默认 backend:8080)
# __BACKEND_HOST__ 占位符由 Dockerfile CMD 中 sed 替换
# ====================================================================

# 动态解析后端服务名(Sealos 生成的服务名带随机后缀, 需运行时解析)
resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

server {
    listen       80;
    server_name  _;

    # 前端静态资源
    root   /usr/share/nginx/html;
    index  index.html;

    # Vue Router history 模式: 单页应用刷新回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    # 使用 set 变量 + resolver 实现运行时 DNS 解析, 避免后端未就绪时 nginx 启动失败
    location /api/ {
        set $backend http://__BACKEND_HOST__;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;
}
